# Release @kinlock/sdk when an `sdk-vX.Y.Z` tag is pushed (ADR-0026, roadmap M2-17): the packed
# .tgz is attached to a GitHub Release of that tag. Refuses to release if the tag doesn't match
# packages/sdk/package.json or any check fails. Uses the workflow's GITHUB_TOKEN; no publish secret.
name: publish
on:
  push:
    tags: ["sdk-v*"]
permissions:
  contents: write # create the GitHub Release
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - name: Tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#sdk-v}"
          pkg_version="$(jq -r .version packages/sdk/package.json)"
          [ "$tag_version" = "$pkg_version" ] || { echo "::error::tag $tag_version != package.json $pkg_version"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @kinlock/sdk build
      - run: pnpm --filter @kinlock/sdk pack --pack-destination "$RUNNER_TEMP"
      - name: Attach to a GitHub Release (never re-uploads an existing version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tgz="$RUNNER_TEMP/kinlock-sdk-${GITHUB_REF_NAME#sdk-v}.tgz"
          test -f "$tgz"
          gh release create "$GITHUB_REF_NAME" "$tgz" \
            --title "@kinlock/sdk ${GITHUB_REF_NAME#sdk-v}" \
            --notes "Install: \`pnpm add https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$tgz")\`"
