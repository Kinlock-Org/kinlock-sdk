packages:
  - "packages/*"
  - "services/*"

# follow-redirects is not a dependency of either workspace package; it reaches the tree
# only as @stellar/stellar-sdk -> axios -> follow-redirects, so no direct bump can pin it.
# esbuild: resolves GHSA-67mh-4wv8-2f99 (<0.25.0) pulled transitively via drizzle-kit
overrides:
  "follow-redirects@<1.16.2": ">=1.16.2"
  "esbuild@<0.25.0": ">=0.25.0"
